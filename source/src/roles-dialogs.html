<dialog class="sheet" id="rolePickerDialog" aria-labelledby="rolePickerTitle"><div class="sheet-grip" aria-hidden="true"></div><div class="sheet-head"><div><h2 id="rolePickerTitle">选择角色</h2><p id="rolePickerHelp"></p></div><button class="icon-button" data-close="rolePickerDialog" aria-label="关闭角色选择"><span class="close-glyph">×</span></button></div><div class="sheet-body"><input id="roleSearch" type="search" placeholder="搜索角色，例如：白狼王" aria-label="搜索角色"><div id="rolePickerList"></div></div><div class="sheet-actions"><button class="full" id="clearRole">清除角色</button></div></dialog>
<dialog class="sheet" id="boardDialog" aria-labelledby="boardTitle"><form id="boardForm"><div class="sheet-grip" aria-hidden="true"></div><div class="sheet-head"><div><h2 id="boardTitle">角色与板子</h2><p>选择牌组，不是分配每个人的身份</p></div><button type="button" class="icon-button" data-close="boardDialog" aria-label="关闭角色板子"><span class="close-glyph">×</span></button></div><div class="sheet-body"><div class="board-totals" id="boardTotals"></div><label class="sr-only" for="boardPreset">示例板子</label><select id="boardPreset"></select><label class="toggle-label board-enable"><input id="boardEnabled" type="checkbox"><span>使用角色配额约束</span></label><p class="help" id="boardCountHint"></p><div id="boardRows" class="role-count-list"></div><label class="sr-only" for="boardAddRole">添加角色</label><select id="boardAddRole"></select><details class="advanced"><summary>自定义其他角色</summary><div class="advanced-content"><div class="form-two"><label class="field-label">角色名称<input id="boardCustomName" maxlength="16" placeholder="例如：机械狼"></label><label class="field-label">底牌阵营<select id="boardCustomCamp"><option value="good">非狼牌</option><option value="wolf">狼牌</option></select></label></div><label class="field-label">技能说明<input id="boardCustomDesc" maxlength="240" placeholder="按本桌规则记录"></label><button type="button" id="boardAddCustom" class="full">添加到本局</button><p class="help">第三方胜利关系在玩家详情单独标记，不与狼底牌混为一谈。</p></div></details><details class="advanced"><summary>本桌技能规则</summary><div class="advanced-content rule-options"><label class="toggle-label"><input id="ruleGuardRepeat" type="checkbox"><span>允许守卫连续两晚守同一人</span></label><label class="toggle-label"><input id="ruleWitchDouble" type="checkbox"><span>允许女巫同夜双药</span></label><label class="field-label">女巫自救<select id="ruleSelfSave"><option value="never">全程不可自救</option><option value="first">仅首夜可自救</option><option value="always">允许任意夜自救</option></select></label><label class="toggle-label"><input id="rulePoisonStops" type="checkbox" checked><span>毒杀禁止猎人 / 黑狼王开枪</span></label><label class="toggle-label"><input id="ruleBlackExplode" type="checkbox"><span>允许黑狼王自爆后开枪</span></label><label class="field-label">其他规则<textarea id="boardRuleNote" rows="3" maxlength="1500" placeholder="如同守同救、殉情、技能先后顺序、丘比特胜利条件……"></textarea></label><p class="help">规则用于冲突提醒，不是自动裁判；技能连锁、死亡与胜负始终以法官为准。</p></div></details><p class="form-error" id="boardError" role="alert"></p></div><div class="sheet-actions"><button type="submit" class="primary full" id="saveBoard">保存角色与板子</button></div></form></dialog>
<dialog class="sheet" id="skillDialog" aria-labelledby="skillTitle"><form id="skillForm"><div class="sheet-grip" aria-hidden="true"></div><div class="sheet-head"><div><h2 id="skillTitle">记技能</h2><p>保留每一轮的对象与结果</p></div><button type="button" class="icon-button" data-close="skillDialog" aria-label="关闭技能记录"><span class="close-glyph">×</span></button></div><div class="sheet-body"><div class="form-two"><label class="field-label">使用者<select id="skillActor"></select></label><label class="field-label">使用的角色<select id="skillRole"></select></label></div><label class="field-label">技能<select id="skillType"></select></label><p class="help" id="skillRoleHelp"></p><div class="form-two"><label class="field-label">目标一<select id="skillTarget1"></select></label><label class="field-label">目标二<select id="skillTarget2"></select></label></div><div class="form-two"><label class="field-label">第几轮<input id="skillRound" type="number" inputmode="numeric" min="1" max="999" required></label><label class="field-label">昼夜<select id="skillPhase"><option value="day">白天</option><option value="night">夜晚</option></select></label></div><label class="field-label" id="skillResultWrap">报告结果<select id="skillResult"></select></label><label class="field-label">信息状态<select id="skillStatus"><option value="claimed">声称 / 未核实</option><option value="confirmed">已确认发生</option></select></label><p class="help" id="skillStatusHint"></p><label class="field-label">备注<textarea id="skillNote" rows="2" maxlength="1500" placeholder="记录验人报告、特殊判定或技能说明"></textarea></label><p class="parser-warnings" id="skillWarnings"></p><label class="toggle-label" id="skillOverrideWrap" hidden><input id="skillOverride" type="checkbox"><span>已核对，按本桌规则保留这条记录</span></label><p class="form-error" id="skillError" role="alert"></p></div><div class="sheet-actions"><button type="submit" id="saveSkill" class="primary full">记录技能</button></div></form></dialog>
